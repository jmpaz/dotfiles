term-playing-msg=" "

# Always fit the video to the window size
video-unscaled=no
keepaspect-window=yes

# Set a default size that's centered
autofit=70%x70%

# Limit the maximum size
autofit-larger=80%x80%

# Set a minimum size for small videos
autofit-smaller=30%x30%

# Start in windowed mode
fullscreen=no

# Center the window on the screen
geometry=50%:50%

# Allow window resizing
keep-open=yes

# Force window positioning
force-window-position=yes

# Center on screen
screen=0
